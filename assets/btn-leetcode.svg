<svg xmlns="http://www.w3.org/2000/svg" width="250" height="56" viewBox="0 0 250 56" role="img" aria-labelledby="t d">
<title id="t">LEETCODE</title>
<desc id="d">Link: LEETCODE</desc>
<style>
text{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.in{opacity:0;animation:in .01s linear forwards}
.fade{opacity:0;animation:in .7s ease forwards}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes in{to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes dash{to{stroke-dashoffset:0}}

.sh{animation:sh 3.6s ease-in-out infinite}
@keyframes sh{0%,60%{transform:translateX(-60px)}100%{transform:translateX(310px)}}
@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.in,.fade{opacity:1!important}
.d{stroke-dashoffset:0!important}
}</style>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#2a2640"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".028"/></pattern>
<clipPath id="frame"><rect width="250" height="56" rx="10"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="250" height="56" fill="#07060b"/>

<defs><linearGradient id="s" x1="0" x2="1"><stop stop-color="#00e5ff" stop-opacity="0"/><stop offset=".5" stop-color="#00e5ff" stop-opacity=".28"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></linearGradient></defs>
<rect class="sh" width="60" height="56" fill="url(#s)"/>
<rect x="1" y="1" width="248" height="54" rx="9" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
<rect x="14" y="20" width="4" height="16" fill="#00e5ff"/>
<text x="131" y="34" font-size="16" fill="#ece9f8" font-weight="700" text-anchor="middle" textLength="100.8" lengthAdjust="spacing">LEETCODE</text>
<path d="M224 22l6 6-6 6" fill="none" stroke="#00e5ff" stroke-width="2"/>
<rect width="250" height="56" fill="url(#scan)"/>
</g>

</svg>
