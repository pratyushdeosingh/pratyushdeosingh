<text x="806" y="282" font-size="10.5" fill="#544f6e" textLength="49.8" lengthAdjust="spacing">STATUS</text>
<circle class="pulse" cx="811" cy="297" r="4" fill="#3ddc97"/>
<text x="824" y="302" font-size="15" fill="#3ddc97" font-weight="700" textLength="180.5" lengthAdjust="spacing">OPEN TO INTERNSHIPS</text>
</g>
