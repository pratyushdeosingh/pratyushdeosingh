<text x="806" y="237" font-size="10.5" fill="#544f6e" textLength="41.5" lengthAdjust="spacing">FOCUS</text>

<text x="806" y="257" font-size="15" fill="#ece9f8" font-weight="700" textLength="199.5" lengthAdjust="spacing">DSA / FULL-STACK / AI</text>
</g>
