<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="336" viewBox="0 0 1200 336" role="img" aria-labelledby="t d">
<title id="t">About</title>
<desc id="d">I like building things and understanding how they work at a deeper level. I'm a Computer Science undergraduate at VIT Chennai. I build web apps, connect systems, and follow interesting problems: fraud-detection pipelines, agentic marketplaces, IoT hardware and a hazard-inspection rover. Right now I'm sharpening Data Structures &amp; Algorithms and exploring better interfaces and the systems behind them.</desc>
<style>
text{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.in{opacity:0;animation:in .01s linear forwards}
.fade{opacity:0;animation:in .7s ease forwards}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes in{to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes dash{to{stroke-dashoffset:0}}

.bar{transform-origin:0 96px;animation:grow 1s .1s cubic-bezier(.7,0,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.scanv{animation:scanv 6s ease-in-out infinite}
@keyframes scanv{0%,100%{transform:translateY(0)}50%{transform:translateY(206px)}}
@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.in,.fade{opacity:1!important}
.d{stroke-dashoffset:0!important}
}</style>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#2a2640"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".028"/></pattern>
<clipPath id="frame"><rect width="1200" height="336" rx="14"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="336" fill="#07060b"/>

<defs>
<radialGradient id="g" cx="0%" cy="100%" r="70%"><stop stop-color="#00e5ff" stop-opacity=".12"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#00e5ff"/><stop offset="1" stop-color="#ff2a6d"/></linearGradient>
</defs>
<rect width="1200" height="336" fill="url(#dots)" opacity=".5"/>
<rect width="1200" height="336" fill="url(#g)"/>
<text x="48" y="50" font-size="14" fill="#ff2a6d" font-weight="700" textLength="16.8" lengthAdjust="spacing">00</text>
<text x="74" y="50" font-size="14" fill="#544f6e" textLength="16.8" lengthAdjust="spacing">//</text>
<text x="100" y="50" font-size="14" fill="#ece9f8" font-weight="700" textLength="62" lengthAdjust="spacing">ABOUT</text>
<text x="1152" y="50" font-size="11" fill="#544f6e" text-anchor="end" textLength="129" lengthAdjust="spacing">PROFILE.DOSSIER</text>
<path d="M48 68H1152" stroke="#231f36"/>
<rect class="bar" x="48" y="96" width="4" height="58" fill="url(#bg)"/>
<text x="70" y="116" font-size="20" fill="#ece9f8" font-weight="700" class="fade" style="animation-delay:200ms" textLength="648" lengthAdjust="spacing">I like building things and understanding how they work</text><text x="70" y="146" font-size="20" fill="#ece9f8" font-weight="700" class="fade" style="animation-delay:340ms" textLength="216" lengthAdjust="spacing">at a deeper level.</text><text x="70" y="188" font-size="15" fill="#9a96b4" class="fade" style="animation-delay:480ms" textLength="630" lengthAdjust="spacing">I'm a Computer Science undergraduate at VIT Chennai. I build web apps,</text><text x="70" y="213" font-size="15" fill="#9a96b4" class="fade" style="animation-delay:590ms" textLength="585" lengthAdjust="spacing">connect systems, and follow interesting problems: fraud-detection</text><text x="70" y="238" font-size="15" fill="#9a96b4" class="fade" style="animation-delay:700ms" textLength="621" lengthAdjust="spacing">pipelines, agentic marketplaces, IoT hardware and a hazard-inspection</text><text x="70" y="263" font-size="15" fill="#9a96b4" class="fade" style="animation-delay:810ms" textLength="666" lengthAdjust="spacing">rover. Right now I'm sharpening Data Structures &amp; Algorithms and exploring</text><text x="70" y="288" font-size="15" fill="#9a96b4" class="fade" style="animation-delay:920ms" textLength="414" lengthAdjust="spacing">better interfaces and the systems behind them.</text>
<path d="M772 90V302" stroke="#231f36"/>
<rect class="scanv" x="770" y="90" width="5" height="34" fill="#00e5ff" opacity=".8"/>
<g class="fade" style="animation-delay:500ms">
<text x="806" y="102" font-size="10.5" fill="#544f6e" textLength="33.2" lengthAdjust="spacing">BASE</text>

<text x="806" y="122" font-size="15" fill="#ece9f8" font-weight="700" textLength="133" lengthAdjust="spacing">CHENNAI, INDIA</text>
