<svg xmlns="http://www.w3.org/2000/svg" width="584" height="304" viewBox="0 0 584 304" role="img" aria-labelledby="t d">
<title id="t">SAFETY HELMET: IOT CRASH DETECTION</title>
<desc id="d">Detects crashes with an MPU6050 motion sensor and fires a cancellable emergency alert, streaming GPS and motion data to a real-time dashboard.</desc>
<style>
text{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.in{opacity:0;animation:in .01s linear forwards}
.fade{opacity:0;animation:in .7s ease forwards}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes in{to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes dash{to{stroke-dashoffset:0}}

.tr{stroke-dasharray:140 1776;animation:tr 7s -3.3000000000000003s linear infinite}
@keyframes tr{from{stroke-dashoffset:1916}to{stroke-dashoffset:0}}
@keyframes bar{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
@keyframes ring{0%{transform:scale(.15);opacity:1}100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.in,.fade{opacity:1!important}
.d{stroke-dashoffset:0!important}
}</style>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#2a2640"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".028"/></pattern>
<clipPath id="frame"><rect width="584" height="304" rx="14"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="584" height="304" fill="#07060b"/>

<defs><radialGradient id="g" cx="88%" cy="8%" r="70%"><stop stop-color="#ff2a6d" stop-opacity=".13"/><stop offset="1" stop-color="#ff2a6d" stop-opacity="0"/></radialGradient></defs>
<rect width="584" height="304" fill="url(#dots)" opacity=".6"/>
<rect width="584" height="304" fill="url(#g)"/>
<rect class="tr" x="1.5" y="1.5" width="581" height="301" rx="13" fill="none" stroke="#ff2a6d" stroke-width="2"/>
<text x="30" y="46" font-size="14" fill="#ff2a6d" font-weight="700" textLength="16.8" lengthAdjust="spacing">04</text>
<rect x="60" y="29" width="82.6" height="24" rx="12" fill="none" stroke="#231f36" stroke-width="1.2"/>
<circle class="pulse" cx="74" cy="41" r="3.5" fill="#544f6e"/>
<text x="84" y="45" font-size="11" fill="#9a96b4" textLength="48.6" lengthAdjust="spacing">PUBLIC</text>
<g transform="translate(446 26)"><g transform="translate(55 40)"><circle r="36" fill="none" stroke="#ff2a6d" stroke-width="1.6" style="transform-origin:0 0;animation:ring 2.4s 0s ease-out infinite;opacity:0"/><circle r="36" fill="none" stroke="#ff2a6d" stroke-width="1.6" style="transform-origin:0 0;animation:ring 2.4s 0.8s ease-out infinite;opacity:0"/><circle r="36" fill="none" stroke="#ff2a6d" stroke-width="1.6" style="transform-origin:0 0;animation:ring 2.4s 1.6s ease-out infinite;opacity:0"/><circle r="5" fill="#ff2a6d"/><path d="M-46 0H-12M12 0H46" stroke="#544f6e"/></g></g>
<text x="30" y="100" font-size="30" fill="#ece9f8" font-weight="700" textLength="247" lengthAdjust="spacing">SAFETY HELMET</text>
<text x="30" y="126" font-size="12" fill="#ff2a6d" textLength="184.3" lengthAdjust="spacing">IOT CRASH DETECTION</text>
<text x="30" y="160" font-size="14.5" fill="#9a96b4" textLength="495.9" lengthAdjust="spacing">Detects crashes with an MPU6050 motion sensor and fires a</text>
<text x="30" y="183" font-size="14.5" fill="#9a96b4" textLength="461.1" lengthAdjust="spacing">cancellable emergency alert, streaming GPS and motion</text>
<text x="30" y="206" font-size="14.5" fill="#9a96b4" textLength="261" lengthAdjust="spacing">data to a real-time dashboard.</text>
<rect x="30" y="246" width="69.2" height="24" rx="4" fill="none" stroke="#231f36" stroke-width="1.2"/><text x="38" y="262" font-size="11" fill="#9a96b4" textLength="53.2" lengthAdjust="spacing">ARDUINO</text><rect x="107.2" y="246" width="38.8" height="24" rx="4" fill="none" stroke="#231f36" stroke-width="1.2"/><text x="115.2" y="262" font-size="11" fill="#9a96b4" textLength="22.8" lengthAdjust="spacing">C++</text><rect x="154" y="246" width="54" height="24" rx="4" fill="none" stroke="#231f36" stroke-width="1.2"/><text x="162" y="262" font-size="11" fill="#9a96b4" textLength="38" lengthAdjust="spacing">REACT</text><rect x="216" y="246" width="69.2" height="24" rx="4" fill="none" stroke="#231f36" stroke-width="1.2"/><text x="224" y="262" font-size="11" fill="#9a96b4" textLength="53.2" lengthAdjust="spacing">NODE.JS</text>
<text x="554" y="263" font-size="12" fill="#ece9f8" font-weight="700" text-anchor="end" textLength="110.4" lengthAdjust="spacing">VIEW CODE &gt;&gt;</text>
<rect width="584" height="304" fill="url(#scan)"/>
</g>
<rect x=".75" y=".75" width="582.5" height="302.5" rx="14" fill="none" stroke="#231f36" stroke-width="1.5"/>
</svg>
