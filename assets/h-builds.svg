<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img" aria-labelledby="t d">
<title id="t">SELECTED BUILDS</title>
<desc id="d">6 ENTRIES</desc>
<style>
text{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.in{opacity:0;animation:in .01s linear forwards}
.fade{opacity:0;animation:in .7s ease forwards}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes in{to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes dash{to{stroke-dashoffset:0}}
.ln{stroke-dasharray:6 10;animation:ln 1.2s linear infinite}@keyframes ln{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.in,.fade{opacity:1!important}
.d{stroke-dashoffset:0!important}
}</style>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#2a2640"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".028"/></pattern>
<clipPath id="frame"><rect width="1200" height="64" rx="12"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="64" fill="#07060b"/>

<text x="40" y="40" font-size="20" fill="#ff2a6d" font-weight="700" textLength="24" lengthAdjust="spacing">01</text>
<text x="72" y="40" font-size="20" fill="#544f6e" textLength="24" lengthAdjust="spacing">//</text>
<text x="104" y="40" font-size="20" fill="#ece9f8" font-weight="700" textLength="240" lengthAdjust="spacing">SELECTED BUILDS</text>
<path class="ln" d="M364 33H1053.2" stroke="#00e5ff" stroke-width="1.5" opacity=".7"/>
<text x="1077.2" y="37" font-size="12" fill="#9a96b4" textLength="82.8" lengthAdjust="spacing">6 ENTRIES</text>
<rect width="1200" height="64" fill="url(#scan)"/>
</g>
<rect x=".75" y=".75" width="1198.5" height="62.5" rx="12" fill="none" stroke="#231f36" stroke-width="1.5"/>
</svg>
