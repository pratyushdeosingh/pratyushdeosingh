<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="t d">
<title id="t">Footer</title>
<desc id="d">CURRENTLY EXPLORING BETTER INTERFACES AND THE SYSTEMS BEHIND THEM.</desc>
<style>
text{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.in{opacity:0;animation:in .01s linear forwards}
.fade{opacity:0;animation:in .7s ease forwards}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes in{to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes dash{to{stroke-dashoffset:0}}

.w1{animation:w1 5s linear infinite}.w2{animation:w2 8s linear infinite}.w3{animation:w3 13s linear infinite}
@keyframes w1{to{transform:translateX(-160px)}}@keyframes w2{to{transform:translateX(-240px)}}@keyframes w3{to{transform:translateX(-360px)}}
@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.in,.fade{opacity:1!important}
.d{stroke-dashoffset:0!important}
}</style>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#2a2640"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".028"/></pattern>
<clipPath id="frame"><rect width="1200" height="150" rx="14"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="150" fill="#07060b"/>

<path class="w3" d="M0 52q90 -26 180 0t180 0q90 -26 180 0t180 0q90 -26 180 0t180 0q90 -26 180 0t180 0q90 -26 180 0t180 0q90 -26 180 0t180 0" fill="none" stroke="#8f6bff" stroke-width="1.2" opacity=".5"/>
<path class="w2" d="M0 52q60 -18 120 0t120 0q60 -18 120 0t120 0q60 -18 120 0t120 0q60 -18 120 0t120 0q60 -18 120 0t120 0q60 -18 120 0t120 0q60 -18 120 0t120 0" fill="none" stroke="#ff2a6d" stroke-width="1.5" opacity=".8"/>
<path class="w1" d="M0 52q40 -11 80 0t80 0q40 -11 80 0t80 0q40 -11 80 0t80 0q40 -11 80 0t80 0q40 -11 80 0t80 0q40 -11 80 0t80 0q40 -11 80 0t80 0q40 -11 80 0t80 0q40 -11 80 0t80 0q40 -11 80 0t80 0" fill="none" stroke="#00e5ff" stroke-width="1.8"/>
<text x="600" y="108" font-size="14" fill="#ece9f8" text-anchor="middle" textLength="719.4" lengthAdjust="spacing">CURRENTLY EXPLORING BETTER INTERFACES AND THE SYSTEMS BEHIND THEM.</text>
<text x="487.8" y="132" font-size="12" fill="#544f6e" textLength="224.4" lengthAdjust="spacing">// END OF TRANSMISSION</text>
<rect class="blink" x="718.2" y="121" width="8" height="13" fill="#ff2a6d"/>
<rect width="1200" height="150" fill="url(#scan)"/>
</g>
<rect x=".75" y=".75" width="1198.5" height="148.5" rx="14" fill="none" stroke="#231f36" stroke-width="1.5"/>
</svg>
