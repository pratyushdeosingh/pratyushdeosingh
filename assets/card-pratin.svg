<svg xmlns="http://www.w3.org/2000/svg" width="584" height="304" viewBox="0 0 584 304" role="img" aria-labelledby="t d">
<title id="t">PRATIN: AGENTIC INVOICE FINANCING</title>
<desc id="d">Reads an invoice PDF, runs explainable risk checks, then lets autonomous capital-provider agents price, rank and settle offers.</desc>
<style>
text{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.in{opacity:0;animation:in .01s linear forwards}
.fade{opacity:0;animation:in .7s ease forwards}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes in{to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes dash{to{stroke-dashoffset:0}}

.tr{stroke-dasharray:140 1776;animation:tr 7s -1.1s linear infinite}
@keyframes tr{from{stroke-dashoffset:1916}to{stroke-dashoffset:0}}
@keyframes bar{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
@keyframes ring{0%{transform:scale(.15);opacity:1}100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.in,.fade{opacity:1!important}
.d{stroke-dashoffset:0!important}
}</style>
<defs>
