<text x="30" y="126" font-size="12" fill="#ff2a6d" textLength="242.5" lengthAdjust="spacing">AGENTIC INVOICE FINANCING</text>
<text x="30" y="160" font-size="14.5" fill="#9a96b4" textLength="487.2" lengthAdjust="spacing">Reads an invoice PDF, runs explainable risk checks, then</text>
<text x="30" y="183" font-size="14.5" fill="#9a96b4" textLength="478.5" lengthAdjust="spacing">lets autonomous capital-provider agents price, rank and</text>
<text x="30" y="206" font-size="14.5" fill="#9a96b4" textLength="121.8" lengthAdjust="spacing">settle offers.</text>
