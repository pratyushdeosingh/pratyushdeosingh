<svg xmlns="http://www.w3.org/2000/svg" width="584" height="304" viewBox="0 0 584 304" role="img" aria-labelledby="t d">
<title id="t">PORTFOLIO: PERSONAL SITE</title>
<desc id="d">A fast, responsive site built with Next.js, React and Tailwind CSS, with an interactive canvas background and scroll-driven motion.</desc>
<style>
text{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.in{opacity:0;animation:in .01s linear forwards}
.fade{opacity:0;animation:in .7s ease forwards}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes in{to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes dash{to{stroke-dashoffset:0}}

.tr{stroke-dasharray:140 1776;animation:tr 7s -5.5s linear infinite}
@keyframes tr{from{stroke-dashoffset:1916}to{stroke-dashoffset:0}}
@keyframes bar{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
@keyframes ring{0%{transform:scale(.15);opacity:1}100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.in,.fade{opacity:1!important}
.d{stroke-dashoffset:0!important}
}</style>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#2a2640"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".028"/></pattern>
<clipPath id="frame"><rect width="584" height="304" rx="14"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="584" height="304" fill="#07060b"/>

<defs><radialGradient id="g" cx="88%" cy="8%" r="70%"><stop stop-color="#ff2a6d" stop-opacity=".13"/><stop offset="1" stop-color="#ff2a6d" stop-opacity="0"/></radialGradient></defs>
<rect width="584" height="304" fill="url(#dots)" opacity=".6"/>
<rect width="584" height="304" fill="url(#g)"/>
<rect class="tr" x="1.5" y="1.5" width="581" height="301" rx="13" fill="none" stroke="#ff2a6d" stroke-width="2"/>
<text x="30" y="46" font-size="14" fill="#ff2a6d" font-weight="700" textLength="16.8" lengthAdjust="spacing">06</text>
<rect x="60" y="29" width="66.4" height="24" rx="12" fill="none" stroke="#3ddc97" stroke-width="1.2"/>
<circle class="pulse" cx="74" cy="41" r="3.5" fill="#3ddc97"/>
<text x="84" y="45" font-size="11" fill="#3ddc97" textLength="32.4" lengthAdjust="spacing">LIVE</text>
<g transform="translate(446 26)"><rect x="4" y="6" width="102" height="68" rx="5" fill="none" stroke="#544f6e" stroke-width="1.5"/>
<path d="M4 22H106" stroke="#544f6e"/><circle cx="14" cy="14" r="2.5" fill="#ff2a6d"/><circle cx="23" cy="14" r="2.5" fill="#f9f002"/><circle cx="32" cy="14" r="2.5" fill="#3ddc97"/>
<rect class="pulse" x="14" y="32" width="50" height="6" fill="#ff2a6d"/><rect class="pulse" x="14" y="44" width="78" height="4" fill="#544f6e" style="animation-delay:.5s"/>
<rect class="pulse" x="14" y="54" width="62" height="4" fill="#544f6e" style="animation-delay:1s"/></g>
<text x="30" y="100" font-size="30" fill="#ece9f8" font-weight="700" textLength="171" lengthAdjust="spacing">PORTFOLIO</text>
<text x="30" y="126" font-size="12" fill="#ff2a6d" textLength="126.1" lengthAdjust="spacing">PERSONAL SITE</text>
<text x="30" y="160" font-size="14.5" fill="#9a96b4" textLength="461.1" lengthAdjust="spacing">A fast, responsive site built with Next.js, React and</text>
<text x="30" y="183" font-size="14.5" fill="#9a96b4" textLength="478.5" lengthAdjust="spacing">Tailwind CSS, with an interactive canvas background and</text>
<text x="30" y="206" font-size="14.5" fill="#9a96b4" textLength="182.7" lengthAdjust="spacing">scroll-driven motion.</text>
<rect x="30" y="246" width="69.2" height="24" rx="4" fill="none" stroke="#231f36" stroke-width="1.2"/><text x="38" y="262" font-size="11" fill="#9a96b4" textLength="53.2" lengthAdjust="spacing">NEXT.JS</text><rect x="107.2" y="246" width="54" height="24" rx="4" fill="none" stroke="#231f36" stroke-width="1.2"/><text x="115.2" y="262" font-size="11" fill="#9a96b4" textLength="38" lengthAdjust="spacing">REACT</text><rect x="169.2" y="246" width="76.8" height="24" rx="4" fill="none" stroke="#231f36" stroke-width="1.2"/><text x="177.2" y="262" font-size="11" fill="#9a96b4" textLength="60.8" lengthAdjust="spacing">TAILWIND</text><rect x="254" y="246" width="61.6" height="24" rx="4" fill="none" stroke="#231f36" stroke-width="1.2"/><text x="262" y="262" font-size="11" fill="#9a96b4" textLength="45.6" lengthAdjust="spacing">CANVAS</text>
<text x="554" y="263" font-size="12" fill="#ece9f8" font-weight="700" text-anchor="end" textLength="119.6" lengthAdjust="spacing">VISIT SITE &gt;&gt;</text>
<rect width="584" height="304" fill="url(#scan)"/>
</g>
<rect x=".75" y=".75" width="582.5" height="302.5" rx="14" fill="none" stroke="#231f36" stroke-width="1.5"/>
</svg>
