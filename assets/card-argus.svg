</g></g>
<text x="30" y="100" font-size="30" fill="#ece9f8" font-weight="700" textLength="95" lengthAdjust="spacing">ARGUS</text>
<text x="30" y="126" font-size="12" fill="#00e5ff" textLength="271.6" lengthAdjust="spacing">FINANCIAL FRAUD INTELLIGENCE</text>
<text x="30" y="160" font-size="14.5" fill="#9a96b4" textLength="469.8" lengthAdjust="spacing">Ingests payments, flags suspicious money movement with</text>
